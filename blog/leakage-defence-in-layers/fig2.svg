<svg width="960" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" aria-label="Object flow: metadata and kinship feed splitGraph, which emits a group_id per sample; bioLeak turns it into LeakSplits and an rsample rset; fastml fits every fold with fold-local preprocessing; bioLeak audits the same folds and feeds flagged near-duplicates back into the metadata.">
<style>
svg{--bg:#f6f7f5; --panel:#ffffff; --ink:#17202b; --ink-2:#465262; --muted:#6a7584; --rule:#d9dee3; --soft:#eceff1;
  --accent:#2d3e50; --sg:#12707a; --fm:#2f5f9e; --bl:#9a5a12; --leak:#b23a30; --ok:#23794f;
  --s1:#2a78d6; --s2:#eb6834; --code:#eef1f3; --hl:rgba(178,58,48,.09);
  --serif:"Literata",Georgia,"Times New Roman",serif; --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;}
svg text{font-family:var(--sans)}
svg .t-ink{fill:var(--ink)} svg .t-2{fill:var(--ink-2)} svg .t-mu{fill:var(--muted)}
svg .grid{stroke:var(--rule);stroke-width:1}
svg .axis{stroke:var(--muted);stroke-width:1}
</style>
<rect width="100%" height="100%" style="fill:var(--panel)"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path></marker>
    <marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--leak)"></path></marker>
  </defs>
  <g style="color:var(--muted)">
    <rect x="8" y="58" width="132" height="120" rx="6" style="fill:var(--soft);stroke:var(--rule)"></rect>
    <text x="74" y="84" text-anchor="middle" class="t-ink" font-size="13" font-weight="700">Metadata</text>
    <text x="74" y="108" text-anchor="middle" class="t-2" font-size="12">sample_id</text>
    <text x="74" y="125" text-anchor="middle" class="t-2" font-size="12">subject · batch</text>
    <text x="74" y="142" text-anchor="middle" class="t-2" font-size="12">visit · time_index</text>
    <text x="74" y="159" text-anchor="middle" class="t-2" font-size="12">+ kinship pairs</text>

    <rect x="172" y="30" width="226" height="176" rx="8" style="fill:none;stroke:var(--sg);stroke-width:1.5"></rect>
    <text x="186" y="52" style="fill:var(--sg)" font-size="13" font-weight="700">splitGraph · declare</text>
    <g font-family="JetBrains Mono, monospace" style="font-variant-ligatures:none" font-size="11.5" class="t-ink">
      <rect x="186" y="64" width="198" height="30" rx="4" style="fill:var(--soft)"></rect><text x="196" y="83">dependency_graph</text>
      <rect x="186" y="110" width="198" height="30" rx="4" style="fill:var(--soft)"></rect><text x="196" y="129">derive_split_constraints()</text>
      <rect x="186" y="156" width="198" height="30" rx="4" style="fill:var(--soft)"></rect><text x="196" y="175">group_id per sample_id</text>
    </g>
    <line x1="285" y1="94" x2="285" y2="108" stroke="currentColor" marker-end="url(#ah)"></line>
    <line x1="285" y1="140" x2="285" y2="154" stroke="currentColor" marker-end="url(#ah)"></line>

    <rect x="430" y="30" width="196" height="176" rx="8" style="fill:none;stroke:var(--bl);stroke-width:1.5"></rect>
    <text x="444" y="52" style="fill:var(--bl)" font-size="13" font-weight="700">bioLeak · plan folds</text>
    <g font-family="JetBrains Mono, monospace" style="font-variant-ligatures:none" font-size="11.5" class="t-ink">
      <rect x="444" y="64" width="168" height="30" rx="4" style="fill:var(--soft)"></rect><text x="454" y="83">make_split_plan()</text>
      <rect x="444" y="110" width="168" height="30" rx="4" style="fill:var(--soft)"></rect><text x="454" y="129">LeakSplits</text>
      <rect x="444" y="156" width="168" height="30" rx="4" style="fill:var(--soft)"></rect><text x="454" y="175">as_rsample() → rset</text>
    </g>
    <line x1="528" y1="94" x2="528" y2="108" stroke="currentColor" marker-end="url(#ah)"></line>
    <line x1="528" y1="140" x2="528" y2="154" stroke="currentColor" marker-end="url(#ah)"></line>

    <rect x="660" y="30" width="292" height="176" rx="8" style="fill:none;stroke:var(--fm);stroke-width:1.5"></rect>
    <text x="674" y="52" style="fill:var(--fm)" font-size="13" font-weight="700">fastml · execute, per fold k</text>
    <g font-family="JetBrains Mono, monospace" style="font-variant-ligatures:none" font-size="11.5" class="t-ink">
      <rect x="674" y="64" width="264" height="30" rx="4" style="fill:var(--soft)"></rect><text x="684" y="83">prep(recipe, analysis_k)</text>
      <rect x="674" y="110" width="264" height="30" rx="4" style="fill:var(--soft)"></rect><text x="684" y="129">fit on bake(analysis_k)</text>
      <rect x="674" y="156" width="264" height="30" rx="4" style="fill:var(--soft)"></rect><text x="684" y="175">score bake(assessment_k)</text>
    </g>
    <line x1="806" y1="94" x2="806" y2="108" stroke="currentColor" marker-end="url(#ah)"></line>
    <line x1="806" y1="140" x2="806" y2="154" stroke="currentColor" marker-end="url(#ah)"></line>

    <line x1="140" y1="118" x2="170" y2="118" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"></line>
    <line x1="384" y1="171" x2="400" y2="171" stroke="currentColor" stroke-width="1.5"></line>
    <path d="M400,171 L414,171 L414,79 L442,79" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"></path>
    <text x="418" y="222" class="t-mu" font-size="11.5" text-anchor="middle">joined by sample_id</text>
    <path d="M612,171 L640,171 L640,125 L658,125" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"></path>
    <text x="643" y="222" class="t-mu" font-size="11.5" text-anchor="middle">resamples =</text>

    <line x1="806" y1="206" x2="806" y2="258" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"></line>
    <rect x="700" y="262" width="212" height="52" rx="6" style="fill:var(--soft);stroke:var(--rule)"></rect>
    <text x="806" y="284" text-anchor="middle" class="t-ink" font-size="13" font-weight="700">CV estimate + final model</text>
    <text x="806" y="302" text-anchor="middle" class="t-2" font-size="12">scored on unseen families</text>

    <line x1="528" y1="206" x2="528" y2="256" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"></line>
    <text x="536" y="236" class="t-mu" font-size="11.5">same folds</text>
    <rect x="410" y="260" width="236" height="118" rx="8" style="fill:none;stroke:var(--bl);stroke-width:1.5"></rect>
    <text x="424" y="282" style="fill:var(--bl)" font-size="13" font-weight="700">bioLeak · audit_leakage()</text>
    <g class="t-ink" font-size="12">
      <text x="424" y="304">near-duplicates (cosine ≥ 0.995)</text>
      <text x="424" y="322">batch × fold association</text>
      <text x="424" y="340">proxy-target scan</text>
      <text x="424" y="358">refitted permutation gap</text>
    </g>

    <path d="M410,330 L74,330 L74,182" fill="none" style="stroke:var(--leak)" stroke-width="2" marker-end="url(#ahl)"></path>
    <text x="96" y="318" style="fill:var(--leak)" font-size="12" font-weight="600">flagged pairs → declare as same subject, rebuild graph</text>
  </g>
</svg>
