<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-label="Figure 3. Six 95% confidence intervals for a reduction in blood pressure, drawn against a shaded zone of trivial effects from minus 5 to 5 mmHg. Three exclude zero and three include it, with different meanings.">
<style>
svg{--bg:#f6f7f5;--panel:#ffffff;--ink:#17202b;--ink-2:#465262;--muted:#626d7b;--rule:#d9dee3;--soft:#eceff1;--accent:#2d3e50;--sg:#12707a;--fm:#2f5f9e;--bl:#9a5a12;--leak:#b23a30;--ok:#23794f;--s1:#2a78d6;--s2:#eb6834;--code:#eef1f3;--hl:rgba(178,58,48,.09);--serif:"Literata",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--pv:#9a5a12;--ef:#12707a;--ci:#2f5f9e;--sitebar-h:52px;background:#ffffff}
